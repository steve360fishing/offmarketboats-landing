<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-label="HELM monogram">
  <!-- Logo B: Bold H monogram with hull/bow shape at base -->
  <g fill="currentColor">
    <!-- H vertical strokes -->
    <rect x="6" y="2" width="7" height="34"/>
    <rect x="35" y="2" width="7" height="34"/>
    <!-- H crossbar -->
    <rect x="13" y="16" width="22" height="6"/>
    <!-- Hull/keel shape -->
    <polygon points="4,40 24,48 44,40 44,38 24,44 4,38"/>
  </g>
</svg>